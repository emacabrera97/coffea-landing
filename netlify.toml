# Configuración de despliegue en Netlify (PRD sección 9)
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caché larga para imágenes e íconos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caché larga para el CSS. Si cambiás un CSS, versionalo (ej. main.v2.css)
# y actualizá el <link> del HTML para que el navegador lo vuelva a descargar.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
